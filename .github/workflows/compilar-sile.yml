name: Compilar documento SILE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Compilar con SILE
        uses: sile-typesetter/sile@v0.15.13
        with:
          args: ejemplo1.sil

      - name: Guardar el PDF generado
        uses: actions/upload-artifact@v4
        with:
          name: ejemplo1-pdf
          path: ejemplo1.pdf
